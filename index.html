<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Attendance</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #ffffff;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      margin-bottom: 25px;
    }

    select {
      width: 340px;
      max-width: 90%;
      padding: 14px;
      margin: 8px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid #999;
      border-radius: 6px;
    }

    video {
      width: 360px;
      max-width: 95%;
      margin-top: 20px;
      border-radius: 15px;
      background: #eeeeee;
    }

    button {
      padding: 15px 25px;
      margin: 10px 5px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #999;
      background: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
      white-space: pre-line;
    }

    #staffStatus {
      margin-top: 5px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Staff Attendance</h1>

  <!-- STAFF NAME -->
  <select id="staff">
    <option value="">Loading Staff List...</option>
  </select>

  <div id="staffStatus">
    Loading staff names...
  </div>

  <br>

  <!-- CAMERA -->
  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <br>

  <!-- BUTTONS -->
  <button
    id="clockIn"
    onclick="submitAttendance('IN')">
    🟢 CLOCK IN
  </button>

  <button
    id="clockOut"
    onclick="submitAttendance('OUT')">
    🔴 CLOCK OUT
  </button>

  <div id="status">
    Starting camera...
  </div>

</div>


<script>

// ==================================================
// APPS SCRIPT WEB APP URL
// ==================================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzfOSbqvB5IsyT0jIl9yPRGsDZfOWJ1xv5XMeBYQWV1K81GjSzjCNzCMOAotTQwGk9lQQ/exec";


// ==================================================
// STAFF LIST
// ==================================================

function loadStaffList() {

  const staffStatus =
    document.getElementById("staffStatus");

  staffStatus.innerText =
    "Loading staff names...";

  const oldScript =
    document.getElementById("staffListScript");

  if (oldScript) {
    oldScript.remove();
  }

  const script =
    document.createElement("script");

  script.id =
    "staffListScript";

  script.src =
    WEB_APP_URL +
    "?mode=staffList" +
    "&callback=staffListCallback" +
    "&t=" + Date.now();

  script.onerror = function() {

    staffStatus.innerText =
      "❌ Unable to load Staff List.";

  };

  document.body.appendChild(script);
}


function staffListCallback(names) {

  const staffSelect =
    document.getElementById("staff");

  const staffStatus =
    document.getElementById("staffStatus");

  staffSelect.innerHTML =
    '<option value="">Select Staff Name</option>';

  names.forEach(function(name) {

    const option =
      document.createElement("option");

    option.value = name;
    option.textContent = name;

    staffSelect.appendChild(option);

  });

  staffStatus.innerText =
    "✅ " + names.length + " staff loaded";
}


// ==================================================
// CAMERA
// ==================================================

const video =
  document.getElementById("video");

const status =
  document.getElementById("status");


async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    video.srcObject = stream;

    status.innerText =
      "✅ Camera ready";

  }

  catch (error) {

    status.innerText =
      "❌ Camera error: " +
      error.name +
      " - " +
      error.message;

  }
}


// ==================================================
// CHECK BEFORE CLOCK
// ==================================================

function checkBeforeClock() {

  const staff =
    document
      .getElementById("staff")
      .value;

  if (!staff) {

    status.innerText =
      "❌ Please select Staff Name.";

    return false;
  }

  if (
    !video.srcObject ||
    video.videoWidth === 0 ||
    video.videoHeight === 0
  ) {

    status.innerText =
      "❌ Camera is not ready.";

    return false;
  }

  return true;
}


// ==================================================
// TAKE PHOTO
// ==================================================

function takePhoto() {

  const canvas =
    document.createElement("canvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  return canvas.toDataURL(
    "image/jpeg",
    0.75
  );
}


// ==================================================
// CLOCK IN / CLOCK OUT
// ==================================================

function doGet(e) {

  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const nameList = ss.getSheetByName("Name List");

  if (!nameList) {
    return ContentService
      .createTextOutput("Name List sheet not found");
  }

  // =========================================
  // STAFF LIST FOR GITHUB
  // =========================================
  if (e && e.parameter.mode === "staffList") {

    const lastRow = nameList.getLastRow();

    let staffNames = [];

    if (lastRow >= 2) {

      staffNames = nameList
        .getRange(2, 3, lastRow - 1, 1)
        .getDisplayValues()
        .flat()
        .map(name => String(name).trim())
        .filter(name => name !== "");
    }

    const uniqueNames =
      [...new Set(staffNames)];

    const callback =
      e.parameter.callback ||
      "staffListCallback";

    return ContentService
      .createTextOutput(
        callback +
        "(" +
        JSON.stringify(uniqueNames) +
        ");"
      )
      .setMimeType(
        ContentService.MimeType.JAVASCRIPT
      );
  }

  return ContentService
    .createTextOutput(
      "Attendance API Ready"
    );
}


// =========================================
// RECEIVE CLOCK IN / CLOCK OUT
// =========================================

function doPost(e) {

  try {

    const data =
      JSON.parse(
        e.postData.contents
      );

    const staffName =
      String(
        data.staffName || ""
      ).trim();

    const action =
      String(
        data.action || ""
      )
      .trim()
      .toUpperCase();

    const photoData =
      String(
        data.photoData || ""
      );


    // =========================================
    // BASIC CHECK
    // =========================================

    if (!staffName) {

      return jsonResponse(
        false,
        "Please select Staff Name."
      );
    }

    if (
      action !== "IN" &&
      action !== "OUT"
    ) {

      return jsonResponse(
        false,
        "Invalid action."
      );
    }

    if (!photoData) {

      return jsonResponse(
        false,
        "Photo is required."
      );
    }


    const ss =
      SpreadsheetApp
        .getActiveSpreadsheet();

    const tz =
      ss.getSpreadsheetTimeZone();

    const nameList =
      ss.getSheetByName(
        "Name List"
      );


    if (!nameList) {

      return jsonResponse(
        false,
        "Name List sheet not found."
      );
    }


    // =========================================
    // CHECK STAFF EXISTS IN NAME LIST
    // COLUMN C = STAFF NAME
    // =========================================

    const lastNameRow =
      nameList.getLastRow();

    if (lastNameRow < 2) {

      return jsonResponse(
        false,
        "No staff found in Name List."
      );
    }


    const staffNames =
      nameList
        .getRange(
          2,
          3,
          lastNameRow - 1,
          1
        )
        .getDisplayValues()
        .flat()
        .map(name =>
          String(name).trim()
        );


    if (
      !staffNames.includes(
        staffName
      )
    ) {

      return jsonResponse(
        false,
        "Staff not found."
      );
    }


    // =========================================
    // FIND STAFF SHEET
    // =========================================

    const sheet =
      ss.getSheetByName(
        staffName
      );


    if (!sheet) {

      return jsonResponse(
        false,
        "Staff sheet not found."
      );
    }


    // =========================================
    // CURRENT TIME / DATES
    // =========================================

    const now =
      new Date();

    const todayText =
      Utilities.formatDate(
        now,
        tz,
        "yyyy-MM-dd"
      );

    const yesterday =
      new Date(now);

    yesterday.setDate(
      yesterday.getDate() - 1
    );

    const yesterdayText =
      Utilities.formatDate(
        yesterday,
        tz,
        "yyyy-MM-dd"
      );


    // =========================================
    // READ DATE COLUMN
    // =========================================

    const lastRow =
      sheet.getLastRow();


    if (lastRow < 4) {

      return jsonResponse(
        false,
        "Staff sheet has no attendance dates."
      );
    }


    const dates =
      sheet
        .getRange(
          4,
          1,
          lastRow - 3,
          1
        )
        .getValues();


    let todayRow = 0;
    let yesterdayRow = 0;


    for (
      let i = 0;
      i < dates.length;
      i++
    ) {

      const dateValue =
        dates[i][0];


      if (
        dateValue instanceof Date
      ) {

        const rowDate =
          Utilities.formatDate(
            dateValue,
            tz,
            "yyyy-MM-dd"
          );


        if (
          rowDate === todayText
        ) {

          todayRow =
            i + 4;
        }


        if (
          rowDate === yesterdayText
        ) {

          yesterdayRow =
            i + 4;
        }
      }
    }


    // =========================================
    // CLOCK IN
    //
    // B = Clock In
    // D = Clock In Photo
    // =========================================

    if (action === "IN") {

      if (!todayRow) {

        return jsonResponse(
          false,
          "Today's date not found."
        );
      }


      const clockInCell =
        sheet.getRange(
          todayRow,
          2
        );

      const photoCell =
        sheet.getRange(
          todayRow,
          4
        );


      if (
        clockInCell
          .getDisplayValue()
          .trim() !== ""
      ) {

        return jsonResponse(
          false,
          "You have already clocked in today."
        );
      }


      const photoUrl =
        saveAttendancePhoto(
          staffName,
          action,
          now,
          photoData
        );


      clockInCell
        .setValue(now)
        .setNumberFormat(
          "HH:mm:ss"
        );


      photoCell
        .setValue(
          photoUrl
        );


      SpreadsheetApp.flush();


      return jsonResponse(
        true,
        "✅ Clock In successful\n" +
        Utilities.formatDate(
          now,
          tz,
          "HH:mm:ss"
        )
      );
    }


    // =========================================
    // CLOCK OUT
    //
    // DAY SHIFT:
    // 今天有 Clock In、今天没有 Clock Out
    // → 写回今天
    //
    // NIGHT SHIFT:
    // 昨天有 Clock In、昨天没有 Clock Out
    // → 写回昨天
    //
    // C = Clock Out
    // E = Clock Out Photo
    // =========================================

    if (action === "OUT") {

      let clockOutRow = 0;


      // =====================================
      // 先检查今天有没有未完成的 Clock In
      // =====================================

      if (todayRow) {

        const todayClockInCell =
          sheet.getRange(
            todayRow,
            2
          );

        const todayClockOutCell =
          sheet.getRange(
            todayRow,
            3
          );


        if (
          todayClockInCell
            .getDisplayValue()
            .trim() !== "" &&
          todayClockOutCell
            .getDisplayValue()
            .trim() === ""
        ) {

          clockOutRow =
            todayRow;
        }
      }


      // =====================================
      // 如果今天没有，再检查昨天
      // =====================================

      if (
        !clockOutRow &&
        yesterdayRow
      ) {

        const yesterdayClockInCell =
          sheet.getRange(
            yesterdayRow,
            2
          );

        const yesterdayClockOutCell =
          sheet.getRange(
            yesterdayRow,
            3
          );


        if (
          yesterdayClockInCell
            .getDisplayValue()
            .trim() !== "" &&
          yesterdayClockOutCell
            .getDisplayValue()
            .trim() === ""
        ) {

          clockOutRow =
            yesterdayRow;
        }
      }


      // =====================================
      // 今天和昨天都找不到 active Clock In
      // =====================================

      if (!clockOutRow) {

        return jsonResponse(
          false,
          "No active Clock In found."
        );
      }


      const clockOutCell =
        sheet.getRange(
          clockOutRow,
          3
        );

      const photoCell =
        sheet.getRange(
          clockOutRow,
          5
        );


      const photoUrl =
        saveAttendancePhoto(
          staffName,
          action,
          now,
          photoData
        );


      clockOutCell
        .setValue(now)
        .setNumberFormat(
          "HH:mm:ss"
        );


      photoCell
        .setValue(
          photoUrl
        );


      SpreadsheetApp.flush();


      return jsonResponse(
        true,
        "✅ Clock Out successful\n" +
        Utilities.formatDate(
          now,
          tz,
          "HH:mm:ss"
        )
      );
    }


    return jsonResponse(
      false,
      "Invalid action."
    );

  }

  catch (error) {

    return jsonResponse(
      false,
      error.message
    );
  }
}


// =========================================
// JSON RESPONSE
// =========================================

function jsonResponse(
  success,
  message
) {

  return ContentService
    .createTextOutput(
      JSON.stringify({
        success: success,
        message: message
      })
    )
    .setMimeType(
      ContentService.MimeType.JSON
    );
}

// ==================================================
// START PAGE
// ==================================================

loadStaffList();
startCamera();

</script>

</body>
</html>
