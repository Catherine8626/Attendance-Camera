<script>

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzfOSbqvB5IsyT0jIl9yPRGsDZfOWJ1xv5XMeBYQWV1K81GjSzjCNzCMOAotTQwGk9lQQ/exec";


// ==============================
// STAFF LIST
// ==============================

async function loadStaffList() {

  const staffSelect =
    document.getElementById("staff");

  const staffStatus =
    document.getElementById("staffStatus");

  try {

    staffStatus.innerText =
      "Loading staff names...";

    const response =
      await fetch(
        WEB_APP_URL + "?mode=staffList"
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const names =
      await response.json();

    staffSelect.innerHTML =
      '<option value="">Select Staff Name</option>';

    names.forEach(function(name) {

      const option =
        document.createElement("option");

      option.value = name;
      option.textContent = name;

      staffSelect.appendChild(option);

    });

    staffStatus.innerText =
      "✅ " +
      names.length +
      " staff loaded";

  }

  catch (error) {

    staffStatus.innerText =
      "❌ Unable to load Staff List: " +
      error.message;

  }
}


// ==============================
// CAMERA
// ==============================

const video =
  document.getElementById("video");

const status =
  document.getElementById("status");


async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    video.srcObject = stream;

    status.innerText =
      "✅ Camera ready";

  }

  catch (error) {

    status.innerText =
      "❌ Camera error: " +
      error.name +
      " - " +
      error.message;

  }

}


// ==============================
// BASIC CHECK
// ==============================

function checkBeforeClock() {

  const staff =
    document
      .getElementById("staff")
      .value;

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();

  if (!staff) {

    status.innerText =
      "❌ Please select Staff Name.";

    return false;
  }

  if (!pin) {

    status.innerText =
      "❌ Please enter PIN.";

    return false;
  }

  if (
    !video.srcObject ||
    video.videoWidth === 0 ||
    video.videoHeight === 0
  ) {

    status.innerText =
      "❌ Camera is not ready.";

    return false;
  }

  return true;
}


// ==============================
// CLOCK IN
// ==============================

function clockIn() {

  if (!checkBeforeClock()) {
    return;
  }

  status.innerText =
    "✅ Staff, PIN and Camera are ready. Clock In connection will be added next.";
}


// ==============================
// CLOCK OUT
// ==============================

function clockOut() {

  if (!checkBeforeClock()) {
    return;
  }

  status.innerText =
    "✅ Staff, PIN and Camera are ready. Clock Out connection will be added next.";
}


// ==============================
// START
// ==============================

loadStaffList();
startCamera();

</script>
