<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Attendance</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 30px;
    }

    select,
    input {
      width: 320px;
      max-width: 90%;
      padding: 12px;
      margin: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    video {
      width: 360px;
      max-width: 95%;
      border-radius: 12px;
      margin-top: 20px;
      background: #eee;
    }

    button {
      padding: 15px 25px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #status {
      margin-top: 18px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>Staff Attendance</h1>

  <select id="staff">
    <option value="">Select Staff Name</option>
  </select>

  <br>

  <input
    id="pin"
    type="password"
    placeholder="Enter PIN"
  >

  <br>

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <br>

  <button id="clockIn">
    🟢 CLOCK IN
  </button>

  <button id="clockOut">
    🔴 CLOCK OUT
  </button>

  <div id="status">
    Starting camera...
  </div>

<script>

const video = document.getElementById("video");
const status = document.getElementById("status");

async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    video.srcObject = stream;

    status.innerText =
      "✅ Camera ready";

  } catch (error) {

    status.innerText =
      "❌ Camera error: " +
      error.name +
      " - " +
      error.message;

  }

}

startCamera();

</script>

</body>
</html>
