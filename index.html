<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Attendance</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #ffffff;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      margin-bottom: 25px;
    }

    select {
      width: 340px;
      max-width: 90%;
      padding: 14px;
      margin: 8px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid #999;
      border-radius: 6px;
    }

    video {
      width: 360px;
      max-width: 95%;
      margin-top: 20px;
      border-radius: 15px;
      background: #eeeeee;
    }

    button {
      padding: 15px 25px;
      margin: 10px 5px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #999;
      background: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
      white-space: pre-line;
    }

    #staffStatus {
      margin-top: 5px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Staff Attendance</h1>

  <select id="staff">
    <option value="">Loading Staff List...</option>
  </select>

  <div id="staffStatus">
    Loading staff names...
  </div>

  <br>

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <br>

  <button
    id="clockIn"
    onclick="submitAttendance('IN')">
    🟢 CLOCK IN
  </button>

  <button
    id="clockOut"
    onclick="submitAttendance('OUT')">
    🔴 CLOCK OUT
  </button>

  <div id="status">
    Starting camera...
  </div>

</div>


<script>

// =========================================
// APPS SCRIPT WEB APP URL
// =========================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzfOSbqvB5IsyT0jIl9yPRGsDZfOWJ1xv5XMeBYQWV1K81GjSzjCNzCMOAotTQwGk9lQQ/exec";


// =========================================
// STAFF LIST
// =========================================

function loadStaffList() {

  const staffStatus =
    document.getElementById("staffStatus");

  staffStatus.innerText =
    "Loading staff names...";

  const oldScript =
    document.getElementById("staffListScript");

  if (oldScript) {
    oldScript.remove();
  }

  const script =
    document.createElement("script");

  script.id =
    "staffListScript";

  script.src =
    WEB_APP_URL +
    "?mode=staffList" +
    "&callback=staffListCallback" +
    "&t=" +
    Date.now();

  script.onerror = function() {
    staffStatus.innerText =
      "❌ Unable to load Staff List.";
  };

  document.body.appendChild(script);
}


function staffListCallback(names) {

  const staffSelect =
    document.getElementById("staff");

  const staffStatus =
    document.getElementById("staffStatus");

  staffSelect.innerHTML =
    '<option value="">Select Staff Name</option>';

  names.forEach(function(name) {

    const option =
      document.createElement("option");

    option.value = name;
    option.textContent = name;

    staffSelect.appendChild(option);

  });

  staffStatus.innerText =
    "✅ " + names.length + " staff loaded";
}


// =========================================
// CAMERA
// =========================================

const video =
  document.getElementById("video");

const status =
  document.getElementById("status");


async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    video.srcObject = stream;

    status.innerText =
      "✅ Camera ready";

  }

  catch (error) {

    status.innerText =
      "❌ Camera error: " +
      error.name +
      " - " +
      error.message;

  }
}


// =========================================
// CHECK
// =========================================

function checkBeforeClock() {

  const staff =
    document.getElementById("staff").value;

  if (!staff) {

    status.innerText =
      "❌ Please select Staff Name.";

    return false;
  }

  if (
    !video.srcObject ||
    video.videoWidth === 0 ||
    video.videoHeight === 0
  ) {

    status.innerText =
      "❌ Camera is not ready.";

    return false;
  }

  return true;
}


// =========================================
// TAKE PHOTO
// =========================================

function takePhoto() {

  const canvas =
    document.createElement("canvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  return canvas.toDataURL(
    "image/jpeg",
    0.75
  );
}


// =========================================
// CLOCK IN / CLOCK OUT
// =========================================

async function submitAttendance(action) {

  if (!checkBeforeClock()) {
    return;
  }

  const staff =
    document.getElementById("staff").value;

  const photoData =
    takePhoto();

  const clockInButton =
    document.getElementById("clockIn");

  const clockOutButton =
    document.getElementById("clockOut");

  clockInButton.disabled = true;
  clockOutButton.disabled = true;

  status.innerText =
    action === "IN"
      ? "⏳ Clocking in..."
      : "⏳ Clocking out...";

  try {

    const response =
      await fetch(WEB_APP_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          staffName: staff,
          action: action,
          photoData: photoData
        })

      });

    const responseText =
      await response.text();

    try {

      const result =
        JSON.parse(responseText);

      status.innerText =
        result.message;

    }

    catch (jsonError) {

      status.innerText =
        action === "IN"
          ? "✅ Clock In submitted"
          : "✅ Clock Out submitted";

    }

  }

  catch (error) {

    status.innerText =
      "❌ Connection error: " +
      error.message;

  }

  finally {

    clockInButton.disabled = false;
    clockOutButton.disabled = false;

  }
}


// =========================================
// START PAGE
// =========================================

loadStaffList();
startCamera();

</script>

</body>
</html>
